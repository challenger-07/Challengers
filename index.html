/* ---------- 3. THEME & POLISH LAYERS ---------- */

/* ::: challenger-new-theme ::: */
/* CHALLENGER NEW COLOUR THEME — visual colours only */
:root{
  --theme-bg:#06101f;
  --theme-bg-2:#0a1729;
  --theme-surface:#0d1c30;
  --theme-surface-2:#10243b;
  --theme-border:#1e4264;
  --theme-border-soft:#173552;
  --theme-text:#f5fbff;
  --theme-muted:#9fb5c9;
  --theme-accent:#22d3ee;
  --theme-accent-2:#3b82f6;
  --theme-accent-soft:rgba(34,211,238,.14);
}

/* Main page / panels */
html, body{
  background:
    radial-gradient(circle at 15% 0%, rgba(34,211,238,.10), transparent 32%),
    radial-gradient(circle at 90% 10%, rgba(59,130,246,.12), transparent 30%),
    linear-gradient(135deg,var(--theme-bg),var(--theme-bg-2)) !important;
  color:var(--theme-text) !important;
}

/* Common dark surfaces */
header, nav, aside, main, section, article,
.card, .panel, .modal, .sidebar, .topbar,
[class*="card"], [class*="panel"], [class*="sidebar"]{
  border-color:var(--theme-border-soft) !important;
}

/* Cards / containers */
.card, .panel, [class*="card"], [class*="panel"]{
  background:linear-gradient(145deg,rgba(16,36,59,.96),rgba(9,24,41,.96)) !important;
}

/* Accent elements */
button:not([disabled]), .active, .selected,
[class*="active"], [class*="selected"]{
  --tw-ring-color:var(--theme-accent) !important;
}

button:not([disabled]){
  border-color:var(--theme-border) !important;
}

a, .accent, [class*="accent"]{
  color:var(--theme-accent) !important;
}

/* Primary buttons */
button.primary, .primary, [class*="primary"]{
  background:linear-gradient(135deg,var(--theme-accent-2),var(--theme-accent)) !important;
  color:#03111d !important;
}

/* Inputs */
input, textarea, select{
  background:#081728 !important;
  border-color:var(--theme-border) !important;
  color:var(--theme-text) !important;
}

input:focus, textarea:focus, select:focus{
  border-color:var(--theme-accent) !important;
  box-shadow:0 0 0 3px var(--theme-accent-soft) !important;
}

/* Muted text */
.text-gray-400,.text-gray-500,.text-gray-600,
.text-muted,[class*="muted"]{
  color:var(--theme-muted) !important;
}

/* Dividers */
hr{
  border-color:var(--theme-border-soft) !important;
}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#06101f}
::-webkit-scrollbar-thumb{
  background:#1d4668;
  border-radius:999px;
}
::-webkit-scrollbar-thumb:hover{background:#22d3ee}

/* ::: challenger-polished-design ::: */
/* Visual polish only — no feature/functionality changes */
:root{
  --p-bg:#050b16;
  --p-bg2:#091426;
  --p-surface:rgba(12,27,47,.88);
  --p-surface2:rgba(15,34,58,.92);
  --p-border:rgba(92,180,255,.16);
  --p-border2:rgba(92,180,255,.28);
  --p-cyan:#22d3ee;
  --p-blue:#3b82f6;
  --p-text:#f5fbff;
  --p-muted:#91a8bf;
}

html,body{
  background:
    radial-gradient(900px 500px at 15% -10%,rgba(34,211,238,.12),transparent 60%),
    radial-gradient(800px 500px at 95% 5%,rgba(59,130,246,.13),transparent 60%),
    linear-gradient(145deg,var(--p-bg),var(--p-bg2)) !important;
  color:var(--p-text);
}

/* Give existing surfaces more depth without changing their structure */
.card,.panel,.modal,[class*="card"],[class*="panel"],aside,nav,header{
  border-color:var(--p-border) !important;
  box-shadow:0 10px 35px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.025) !important;
}

.card,.panel,[class*="card"],[class*="panel"]{
  background:linear-gradient(145deg,var(--p-surface2),var(--p-surface)) !important;
  border-radius:16px !important;
}

/* Cleaner interactive controls */
button{
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease !important;
}
button:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 22px rgba(34,211,238,.12);
}
button:active{transform:translateY(0)}

input,textarea,select{
  border-radius:10px !important;
  background:rgba(5,17,31,.72) !important;
  border-color:var(--p-border) !important;
}
input:focus,textarea:focus,select:focus{
  border-color:rgba(34,211,238,.65) !important;
  box-shadow:0 0 0 3px rgba(34,211,238,.09),0 0 22px rgba(34,211,238,.06) !important;
}

/* Subtle glass header/sidebar finish */
header,nav,aside{
  background:rgba(5,14,27,.78) !important;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

/* Better visual hierarchy for links and accents */
a{
  transition:color .16s ease,opacity .16s ease !important;
}
a:hover{opacity:.9}

hr{
  border-color:var(--p-border) !important;
}

/* Modern scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#050b16}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#1d5b88,#17426a);
  border-radius:99px;
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#22d3ee,#3b82f6)}

/* ::: challenger-stylish-page ::: */
/* Extra page-level polish — existing features and markup remain unchanged */
body{
  min-height:100vh;
  background:
    radial-gradient(700px 420px at 8% 8%,rgba(34,211,238,.10),transparent 65%),
    radial-gradient(650px 420px at 92% 18%,rgba(59,130,246,.11),transparent 65%),
    linear-gradient(145deg,#040a14 0%,#071326 48%,#050c18 100%) !important;
}

/* Make the main content feel more spacious and premium */
main{
  position:relative;
}
main::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
  -webkit-mask-image:linear-gradient(to bottom,black,transparent 85%);
}

/* Existing content blocks */
main > div, main > section{
  position:relative;
}

/* Improve headings without changing their text */
h1,h2,h3{
  letter-spacing:-.02em;
  text-shadow:0 2px 18px rgba(34,211,238,.08);
}

/* Premium accent line on common section headings */
h1::after,h2::after{
  content:"";
  display:block;
  width:54px;
  height:3px;
  margin-top:8px;
  border-radius:99px;
  background:linear-gradient(90deg,#22d3ee,#3b82f6);
  opacity:.75;
}

/* Better cards */
.card,.panel,[class*="card"],[class*="panel"]{
  overflow:hidden !important;
  position:relative;
}
.card::before,.panel::before,[class*="card"]::before,[class*="panel"]::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),transparent);
  opacity:.65;
  pointer-events:none;
}

/* Images/media get a cleaner presentation */
img{
  max-width:100%;
}
.card img,.panel img,[class*="card"] img,[class*="panel"] img{
  border-radius:12px;
}

/* Make navigation feel more refined */
nav a, aside a{
  border-radius:10px;
  transition:all .18s ease !important;
}
nav a:hover, aside a:hover{
  background:rgba(34,211,238,.07) !important;
  transform:translateX(2px);
}

/* Selection */
::selection{
  background:rgba(34,211,238,.28);
  color:#fff;
}

/* ::: challenger-ebook-admin-polish ::: */
/* E-Books presentation — existing functionality/data flow unchanged */
#ebooks{
  scroll-margin-top:90px;
}
.ebook-admin-note{
  color:#91a8bf;
}

/* ::: admin-url-wrap-fix ::: */
/* Keep long URLs and admin form controls inside the viewport. */
*,*::before,*::after{box-sizing:border-box}
input,textarea,select{max-width:100%;min-width:0}
textarea{overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
img{max-width:100%;height:auto}

/* ::: challenger-subtle-admin-access ::: */
/* Keep admin access discreet in the navigation; password gate remains enabled. */

/* ::: challenger-auto-pdf-firstpage-style ::: */
.challenger-pdf-firstpage canvas{background:#fff}.challenger-pdf-firstpage img{background:#fff}.challenger-pdf-firstpage{transition:transform .18s ease}.challenger-pdf-firstpage:hover{transform:translateY(-2px)}@media(max-width:600px){.challenger-pdf-firstpage{max-width:180px!important;margin-left:0!important}}

  #root .space-y-3 > .flex.justify-between.items-center > div{grid-column:1;grid-row:2;font-size:11px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
  #root .space-y-3 > .flex.justify-between.items-center > button{grid-column:2;grid-row:1;white-space:nowrap;align-self:center}
  #challenger-resource-search{width:calc(100% - 20px)!important;max-width:100%;margin:10px auto 14px!important;box-sizing:border-box}
  #challenger-resource-search input{min-width:0;width:100%;font-size:16px!important}
  #challenger-resource-search .crs-wrap{min-width:0;box-sizing:border-box}
}
/* Thumbnail preview should show the PDF's actual first-page image when available */
.ch-pdf-real-thumb{display:block;width:100%;height:100%;object-fit:cover;background:#111}
.ch-pdf-card-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:2}

/* ::: challenger-manual-ebook-cover-style ::: */
.ch-ebook-cover-tools{margin-top:10px;padding:12px;border:1px solid #24445e;border-radius:14px;background:linear-gradient(135deg,#101b27,#111827);color:#dbeafe;font-size:12px}
.ch-ebook-cover-tools label{display:block;font-weight:700;margin-bottom:7px;color:#d8eaff}
.ch-ebook-cover-tools input[type=url]{width:100%;padding:10px;border-radius:9px;background:#08111b;border:1px solid #2c4963;color:#fff;margin-bottom:9px;font-size:13px}
.ch-ebook-cover-tools input[type=file]{width:100%;font-size:12px;color:#cbd5e1}
.ch-ebook-cover-tools .ch-cover-preview{display:flex;align-items:center;gap:12px;margin-top:10px}
.ch-ebook-cover-tools .ch-cover-preview img{width:84px;height:112px;object-fit:cover;border-radius:9px;background:#0b1220;border:1px solid #3b5874}
.ch-ebook-cover-tools .ch-cover-note{color:#91a9bf;line-height:1.5;margin-top:8px}
.ch-manual-cover-card{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:4;border-radius:inherit}

/* ::: challenger-final-cover-and-search-fix ::: */
/* Keep student library covers bright and visible */
#root .ch-manual-cover-card{display:block!important;opacity:1!important;filter:none!important;mix-blend-mode:normal!important;z-index:8!important;pointer-events:none}
#root .ch-pdf-card-thumb{opacity:1!important;filter:none!important;mix-blend-mode:normal!important}
/* Remove the extra resource search bar requested by the site owner */
#challenger-resource-search{display:none!important}

/* CHALLENGER visual refresh — presentation-only overrides; React behavior/data remain unchanged. */
:root{
  color-scheme:dark;
  --ch-bg:#07111f;--ch-surface:#0d1b2b;--ch-surface-2:#112338;
  --ch-border:rgba(148,184,214,.17);--ch-text:#edf6ff;--ch-muted:#9bb0c6;

body{

  letter-spacing:.005em;
}
#root{min-height:100vh;color:var(--ch-text)}
#root *{scrollbar-width:thin;scrollbar-color:#29455f transparent}
#root ::selection{background:rgba(69,215,232,.28);color:#fff}
#root h1,#root h2,#root h3,#root h4{letter-spacing:-.025em;text-wrap:balance}
#root h1{line-height:1.12}
#root p{line-height:1.65}
#root .text-gray-400,#root .text-slate-400,#root .text-zinc-400{color:var(--ch-muted)!important}
#root .text-gray-500,#root .text-slate-500,#root .text-zinc-500{color:#8098b1!important}
#root .border-gray-800,#root .border-gray-700,#root .border-slate-800,#root .border-slate-700,#root .border-zinc-800{border-color:var(--ch-border)!important}
#root .bg-black,#root .bg-\[\#09090b\],#root .bg-\[\#0a0a0a\]{background-color:#07111f!important}
#root .bg-gray-900,#root .bg-slate-900,#root .bg-zinc-900{background-color:var(--ch-surface)!important}
#root .bg-gray-800,#root .bg-slate-800,#root .bg-zinc-800{background-color:var(--ch-surface-2)!important}
#root .rounded-xl,#root .rounded-2xl,#root .rounded-3xl{border-radius:17px}
#root .shadow,#root .shadow-md,#root .shadow-lg,#root .shadow-xl{box-shadow:0 14px 38px rgba(0,0,0,.19)!important}
#root .group{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
#root .group:hover{border-color:rgba(69,215,232,.36)!important;box-shadow:0 18px 42px rgba(0,0,0,.25),0 0 0 1px rgba(69,215,232,.04);}
#root button,#root [role="button"]{
  transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;
}
#root button:not(:disabled):hover{filter:brightness(1.08)}
#root button:active:not(:disabled){transform:translateY(1px)}
#root button:disabled{opacity:.48;cursor:not-allowed}
#root input:not([type="checkbox"]):not([type="radio"]),#root textarea,#root select{
  color:var(--ch-text);background:rgba(5,15,28,.76);border:1px solid rgba(142,177,208,.25);

}
#root input:not([type="checkbox"]):not([type="radio"]):focus,#root textarea:focus,#root select:focus{
  outline:none;border-color:rgba(69,215,232,.8);box-shadow:0 0 0 3px rgba(69,215,232,.13);background:#081827;
}
#root input::placeholder,#root textarea::placeholder{color:#7189a2}
#root a{transition:color .18s ease}
#root a:hover{color:#8deaf2}
#root :focus-visible{outline:2px solid var(--ch-cyan);outline-offset:3px}
#root img{border-radius:inherit}
/* Better reading comfort for long notes, lecture lists, and resource descriptions. */
#root .prose{max-width:78ch;color:#d6e5f4;line-height:1.8}
#root pre,#root code{overflow-wrap:anywhere}
/* Preserve the existing card artwork and PDF cover overlays. */
#root .ch-manual-cover-card,#root .ch-pdf-card-thumb{pointer-events:none}
@media(min-width:1024px){#root .max-w-7xl{max-width:1360px}}
@media(max-width:760px){

  #root .rounded-xl,#root .rounded-2xl,#root .rounded-3xl{border-radius:14px}
  #root button{min-height:38px}
  #root input:not([type="checkbox"]):not([type="radio"]),#root textarea,#root select{font-size:16px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#root *,#root *::before,#root *::after{transition:none!important;animation:none!important}}

*, *::before, *::after { box-sizing: border-box; }

  #root label { overflow-wrap: anywhere; }

}

window.challengerStudentIdentity=function(){try{let v=JSON.parse(localStorage.getItem("challenger_student_identity_v1")||"null");if(v&&v.id&&v.name)return v;let id=prompt("Apna unique Student ID / Roll Number enter karein (har student ka alag hona chahiye):");if(!id||!id.trim())return null;let name=prompt("Leaderboard par dikhne wala naam enter karein:");if(!name||!name.trim())return null;v={id:id.trim(),name:name.trim()};localStorage.setItem("challenger_student_identity_v1",JSON.stringify(v));return v}catch(e){alert("Student identity save nahi ho paayi.");return null}};

<script id="challenger-test-publish">
/* A test is visible to students when it is Active, or its auto-publish time has arrived. */
window.challengerTestLive=function(t){
  return !!t&&(t.active===true||(!!t.publish_at&&new Date(t.publish_at).getTime()<=Date.now()));
};
/* A test is closed for students once its END TIME has passed. */
window.challengerTestEnded=function(t){
  return !!t&&!!t.end_at&&new Date(t.end_at).getTime()<=Date.now();
};
/* Scheduled test whose start time is still in the future (students see "Starting soon"). */
window.challengerTestUpcoming=function(t){
  return !!t&&!t.active&&!!t.publish_at&&new Date(t.publish_at).getTime()>Date.now();
};
/* Remaining time as d h m s until an ISO timestamp. */
window.challengerCountdown=function(iso){
  var ms=new Date(iso).getTime()-Date.now();
  if(!(ms>0))return "0s";
  var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  var p=function(n){return String(n).padStart(2,"0")};
  return (d?d+"d ":"")+p(h)+"h "+p(m)+"m "+p(sec)+"s";
};
/* ISO timestamp -> value for <input type="datetime-local"> in the viewer's own time zone. */
window.challengerLocalInput=function(iso){
  if(!iso)return "";
  var d=new Date(iso); if(isNaN(d))return "";
  var p=function(n){return String(n).padStart(2,"0")};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
};
</script>
<script id="challenger-admin-auth">
/* Admin sign-in via Supabase Auth. No password lives in this file.
   1) Set ADMIN_EMAIL to the admin user you created in Supabase -> Authentication -> Users.
   2) Run supabase-security.sql so only that user can write. */
(function(){
  var SUPABASE_URL="https://nmhfaoxzsnilppeedcov.supabase.co";
  var ANON_KEY="sb_publishable_Nu56qZh3QzpEHzMPx0ds-g_uomnSjrZ";
  var ADMIN_EMAIL="123challenger007@gmail.com";
  var timer=null;
  function schedule(sec,refresh){
    clearTimeout(timer);
    timer=setTimeout(function(){
      post("refresh_token",{refresh_token:refresh}).then(function(r){
        if(r.ok&&r.data.access_token)store(r.data); else window.challengerAdminToken=null;
      });
    },Math.max(30,(sec||3600)-60)*1000);
  }
  function post(grant,body){
    return fetch(SUPABASE_URL+"/auth/v1/token?grant_type="+grant,{
      method:"POST",
      headers:{apikey:ANON_KEY,"Content-Type":"application/json"},
      body:JSON.stringify(body)
    }).then(function(r){return r.json().catch(function(){return {}}).then(function(d){return {ok:r.ok,status:r.status,data:d}})})
      .catch(function(){return {ok:false,status:0,data:{}}});
  }
  function store(d){
    window.challengerAdminToken=d.access_token; // memory only, never saved to storage
    schedule(d.expires_in,d.refresh_token);
  }
  window.challengerAdminLogout=function(){clearTimeout(timer);window.challengerAdminToken=null};
  var tries=0,lockedUntil=0;
  window.challengerAdminError="Access denied";
  window.challengerAdminLogin=function(password){
    if(ADMIN_EMAIL==="admin@example.com"){window.challengerAdminError="Setup baaki hai: HTML file mein ADMIN_EMAIL apni Supabase admin email se badlo";return Promise.resolve(false)}
    if(Date.now()<lockedUntil){window.challengerAdminError="Bahut galat tries. 1 minute baad dobara try karo";return Promise.resolve(false)}
    if(!password){window.challengerAdminError="Password daalo";return Promise.resolve(false)}
    return post("password",{email:ADMIN_EMAIL,password:String(password)}).then(function(r){
      if(r.ok&&r.data.access_token){tries=0;store(r.data);return true}
      var code=(r.data&&(r.data.error_code||r.data.msg||r.data.error_description||""))+"";
      if(r.status===0)window.challengerAdminError="Internet / Supabase se connect nahi ho paaya";
      else if(/email_not_confirmed|not confirmed/i.test(code))window.challengerAdminError="Supabase mein user ko 'Auto Confirm' karo (Users > user > Confirm)";
      else if(/invalid_credentials|invalid login/i.test(code)||r.status===400){window.challengerAdminError="Email ya password galat hai";if(++tries>=5){tries=0;lockedUntil=Date.now()+60000}}
      else if(r.status===429)window.challengerAdminError="Bahut zyada requests. Thodi der baad try karo";
      else window.challengerAdminError="Access denied ("+r.status+")";
      return false;
    });
  };
})();

  file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/i.test(f.type)){alert('JPG, PNG ya WebP image chunein.');file.value='';return}try{const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=reject;reader.readAsDataURL(f)});const source=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dataUrl});const canvas=document.createElement('canvas');let scale=Math.min(1,1200/Math.max(source.naturalWidth,source.naturalHeight));canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(source,0,0,canvas.width,canvas.height);let quality=.88,compressed=canvas.toDataURL('image/jpeg',quality);while(compressed.length*0.75>850000&&quality>.42){quality-=.08;compressed=canvas.toDataURL('image/jpeg',quality)}while(compressed.length*0.75>850000&&canvas.width>360){const w=Math.max(360,Math.round(canvas.width*.82)),h=Math.max(360,Math.round(canvas.height*.82));canvas.width=w;canvas.height=h;ctx.drawImage(source,0,0,w,h);compressed=canvas.toDataURL('image/jpeg',quality)}if(compressed.length*0.75>900000){alert('Image compress nahi ho paayi. Dusri image try karein.');file.value='';return}const all=read();all[key()]={src:compressed,manual:true};write(all);url.value='';refresh();alert('Cover image compress hokar save ho gayi.')}catch(e){alert('Image read nahi ho paayi. JPG ya PNG image try karein.')} });
  url.addEventListener('change',()=>{const v=url.value.trim();if(v){const all=read();all[key()]={src:v,manual:true};write(all)}else{const all=read();delete all[key()];write(all)}refresh()});
  tools.querySelector('.ch-cover-clear').addEventListener('click',()=>{const all=read();delete all[key()];write(all);url.value='';file.value='';refresh()});ta.addEventListener('input',refresh);
 };
 const applyCards=()=>{const all=read();for(const a of document.querySelectorAll('a[href]')){const id=getId(a.href);const card=a.closest('.group');if(!card)continue;const cover=card.querySelector('.aspect-\\[16/10\\]')||card.querySelector('[class*="aspect-[16/10]"]');if(!cover)continue;const key=id||('title:'+((card.innerText||'ebook').split('\n').find(Boolean)||'ebook').trim().toLowerCase());const saved=all[key];let im=cover.querySelector('.ch-manual-cover-card');if(saved?.src){if(!im){im=document.createElement('img');im.className='ch-manual-cover-card';im.alt='E-book cover';cover.style.position='relative';cover.prepend(im)}if(im.src!==saved.src)im.src=saved.src}}};

<script id="challenger-student-cover-sync-fix">
(()=>{
 const STORE='challenger_ebook_manual_covers_v1';
 const read=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}};
 const getId=raw=>{try{const u=new URL(raw,location.href);let m=u.pathname.match(/\/file\/d\/([\w-]+)/);if(m)return m[1];return u.searchParams.get('id')||u.searchParams.get('fileId')||null}catch(e){let m=String(raw||'').match(/(?:\/file\/d\/|[?&]id=)([\w-]+)/);return m?m[1]:null}};
 const norm=t=>(t||'').replace(/\s+/g,' ').trim().toLowerCase();
 function apply(){const all=read();document.querySelectorAll('#root .group').forEach(card=>{
   const cover=card.querySelector('.aspect-\\[16\\/10\\]')||card.querySelector('[class*="aspect-[16/10]"]');if(!cover)return;
   const a=card.querySelector('a[href]');const id=a?getId(a.href):null;
   const title=norm(card.querySelector('h3')?.textContent||card.querySelector('h2')?.textContent||card.innerText.split('\n').map(x=>x.trim()).filter(Boolean).slice(-3,-2)[0]||'');
   let record=id?all[id]:null;
   if(!record){for(const [k,v] of Object.entries(all)){if(k.startsWith('title:')&&title&&title.includes(norm(k.slice(6)))){record=v;break}}}
   let im=cover.querySelector('.ch-manual-cover-card');
   if(record?.src){if(!im){im=document.createElement('img');im.className='ch-manual-cover-card';im.alt='E-book cover';cover.style.position='relative';cover.prepend(im)}if(im.src!==record.src)im.src=record.src;im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;opacity:1;filter:none;pointer-events:none;border-radius:inherit';}
 });}
 function start(){apply();const root=document.getElementById('root');if(root)new MutationObserver(()=>apply()).observe(root,{childList:true,subtree:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="challenger-video-player">
/* In-app video player: YouTube / Drive links in the Videos section open in a modal instead of a new tab. */
(function(){
  function parse(href){
    try{
      var u=new URL(href,document.baseURI),h=u.hostname.toLowerCase().replace(/^www\./,'').replace(/^m\./,''),id=null;
      if(h==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0];
      else if(h==='youtube.com'||h==='music.youtube.com'||h==='youtube-nocookie.com'){
        if(u.pathname==='/watch')id=u.searchParams.get('v');
        else{var m=u.pathname.match(/^\/(?:embed|shorts|live|v)\/([^\/?#]+)/);if(m)id=m[1]}
      }
      if(id&&/^[A-Za-z0-9_-]{11}$/.test(id)){
        var t=u.searchParams.get('t')||u.searchParams.get('start'),st=t&&parseInt(t,10)>0?'&start='+parseInt(t,10):'';
        return {kind:'yt',src:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1'+st,open:href};
      }
      if(h==='drive.google.com'){
        var d=u.pathname.match(/\/file\/d\/([^\/]+)/)||null,did=d?d[1]:u.searchParams.get('id');
        if(did)return {kind:'drive',src:'https://drive.google.com/file/d/'+did+'/preview',open:href};
      }
    }catch(e){}
    return null;
  }
  var box=null,open=false;
  function ensure(){
    if(box)return box;
    var st=document.createElement('style');
    st.textContent='#ch-player{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}'+
    '#ch-player.on{display:flex}#ch-player .chp-bar{width:100%;max-width:1000px;display:flex;align-items:center;gap:10px;padding:10px 0;color:#e5e7eb;font:600 13px/1.3 system-ui,sans-serif}'+
    '#ch-player .chp-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'+
    '#ch-player .chp-btn{flex:none;border:1px solid #333;background:#1e1e1e;color:#fff;border-radius:10px;padding:8px 12px;font:600 12px system-ui,sans-serif;text-decoration:none;cursor:pointer}'+
    '#ch-player .chp-wrap{width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a}'+
    '#ch-player iframe{width:100%;height:100%;border:0;display:block}';
    document.head.appendChild(st);
    box=document.createElement('div');box.id='ch-player';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
    box.innerHTML='<div class="chp-bar"><div class="chp-title"></div><a class="chp-btn chp-ext" target="_blank" rel="noopener">YouTube \u2197</a><button class="chp-btn chp-close" type="button">\u2715 Close</button></div><div class="chp-wrap"></div>';
    box.addEventListener('click',function(e){if(e.target===box)close(true)});
    box.querySelector('.chp-close').addEventListener('click',function(){close(true)});
    document.body.appendChild(box);
    return box;
  }
  function play(info,title){
    var b=ensure(),w=b.querySelector('.chp-wrap');
    w.innerHTML='';
    var f=document.createElement('iframe');
    f.src=info.src;f.title=title||'Video player';f.allowFullscreen=true;
    f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen');
    f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
    w.appendChild(f);
    b.querySelector('.chp-title').textContent=title||'';
    var ext=b.querySelector('.chp-ext');ext.href=info.open;ext.textContent=info.kind==='drive'?'Drive \u2197':'YouTube \u2197';
    b.classList.add('on');document.documentElement.style.overflow='hidden';
    if(!open){open=true;try{history.pushState({chPlayer:1},'')}catch(e){}}
  }
  function close(fromUi){
    if(!box||!box.classList.contains('on'))return;
    box.classList.remove('on');box.querySelector('.chp-wrap').innerHTML='';
    document.documentElement.style.overflow='';
    if(open){open=false;if(fromUi){try{if(history.state&&history.state.chPlayer)history.back()}catch(e){}}}
  }
  window.addEventListener('popstate',function(){if(open)close(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close(true)});
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||!a.closest('#root')||e.ctrlKey||e.metaKey||e.shiftKey||e.button===1)return;
    var card=a.closest('.group');
    if(!card||!card.querySelector('.aspect-video'))return;
    var info=parse(a.getAttribute('href'));
    if(!info)return;
    e.preventDefault();e.stopPropagation();
    var t=card.querySelector('.line-clamp-2');
    play(info,t?t.textContent.trim():'');
  },true);
})();
</script>
