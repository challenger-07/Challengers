name: Build CHALLENGER Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f index.html || { echo "ERROR: index.html not found"; exit 1; }
          test -f package.json || { echo "ERROR: package.json not found"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json not found"; exit 1; }

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists"
          fi

      - name: Add permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in content:
                  content = content.replace('<application', permission + '\n    <application', 1)
          path.write_text(content)
          print("All permissions added.")
          PY

      - name: Enable secure screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/java")
          files = list(root.rglob("MainActivity.java")) + list(root.rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("ERROR: MainActivity file not found")
          path = files[0]
          content = path.read_text()
          if "FLAG_SECURE" in content:
              print("FLAG_SECURE already configured.")
              raise SystemExit(0)
          if path.suffix == ".java":
              marker = "super.onCreate(savedInstanceState);"
              if marker not in content:
                  raise SystemExit("ERROR: Java onCreate method not found")
              import_line = "import android.view.WindowManager;"
              if import_line not in content:
                  content = content.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\n" + import_line)
              content = content.replace(marker, marker + "\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);", 1)
          else:
              marker = "super.onCreate(savedInstanceState)"
              if marker not in content:
                  raise SystemExit("ERROR: Kotlin onCreate method not found")
              import_line = "import android.view.WindowManager"
              if import_line not in content:
                  content = import_line + "\n" + content
              content = content.replace(marker, marker + "\n        window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)", 1)
          path.write_text(content)
          print("Secure screen configured.")
          PY

      - name: Prepare app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p resources
            cp icon.png resources/icon.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#121212' --iconBackgroundColorDark '#121212'
          else
            echo "icon.png not found; using default icon"
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: challenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
