
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Add camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          for permission in permissions:
              if permission not in content:
                  content = content.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          path.write_text(content)
          print("Permissions added.")
          PY

      - name: Prepare app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p resources
            cp icon.png resources/icon.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#121212' --iconBackgroundColorDark '#121212'
          else
            echo "icon.png nahi mili, default icon use hoga"
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: challenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
